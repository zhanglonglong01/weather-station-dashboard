services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: weather_station
      MYSQL_USER: weather
      MYSQL_PASSWORD: ${DB_PASSWORD:?Generate .env with scripts/init_env.py}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Generate .env with scripts/init_env.py}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u weather -D weather_station -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  api:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      DB_URL: jdbc:mysql://db:3306/weather_station?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=Asia/Shanghai&forceConnectionTimeZoneToSession=true
      DB_USER: weather
      DB_PASSWORD: ${DB_PASSWORD}
      INGEST_API_KEY: ${INGEST_API_KEY:?Generate .env with scripts/init_env.py}
      DATASET_SEED_ENABLED: ${DATASET_SEED_ENABLED:-true}
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
  web:
    build: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-8088}:80"
    depends_on:
      - api
    restart: unless-stopped
volumes:
  mysql_data:
